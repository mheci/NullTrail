name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate parse + version/tag consistency
        run: |
          VERSION="$(sed -n 's|^// @version[[:space:]]*||p' NullTrail.user.js | head -n1 | tr -d '[:space:]')"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::@version ($VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi
          node --check NullTrail.user.js

      - name: Create/update GitHub Release with userscript asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" NullTrail.user.js --clobber
          else
            gh release create "$GITHUB_REF_NAME" NullTrail.user.js \
              --title "NullTrail $GITHUB_REF_NAME" \
              --notes "$NOTES"
          fi
